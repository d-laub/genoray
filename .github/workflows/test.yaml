name: Test

on:
  # Deliberately unfiltered by base branch. A stacked PR is based on the branch
  # below it, not on a trunk, so a `branches:` allowlist silently skips this
  # workflow for every layer except the bottom one -- those PRs ran `prek` and
  # nothing else. Branch protection still requires these checks, so the missing
  # runs made an atomic `gh stack merge` of a whole stack impossible: it reported
  # "5 of 6 required status checks are expected" and refused. Stack branch names
  # are arbitrary (`fix/...`, `perf/...`, `test-hygiene/...`), so no allowlist
  # can cover them; testing every PR base is the only version that holds.
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: "Run test across all Python versions"
    strategy:
      fail-fast: false
      matrix:
        environment: [py310, py311, py312, py313, py314]
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.5
        with:
          pixi-version: v0.70.2
          environments: ${{ matrix.environment }}
      - name: Test
        run: pixi run -e ${{ matrix.environment }} test

  rust-test:
    runs-on: ubuntu-latest
    name: "Run Rust test suite"
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.5
        with:
          pixi-version: v0.70.2
          environments: lint
      - name: Cargo check (query-core, no conversion)
        run: pixi run -e lint check-core
      - name: Cargo test
        run: pixi run -e lint test-rust
